<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Worf Cloud</title>
        <style>
            :root {
                color-scheme: light;
                --accent-50: #EEF2FF;
                --accent-100: #E0E7FF;
                --accent-500: #6366F1;
                --accent-600: #4F46E5;
                --accent-700: #4338CA;
                --violet-500: #8B5CF6;
                --gray-50: #F9FAFB;
                --gray-100: #F3F4F6;
                --gray-200: #E5E7EB;
                --gray-400: #9CA3AF;
                --gray-500: #6B7280;
                --gray-600: #4B5563;
                --gray-700: #374151;
                --gray-900: #111827;
            }

            * { box-sizing: border-box; }

            html {
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            body {
                margin: 0;
                min-height: 100vh;
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                color: var(--gray-700);
                background: var(--gray-50);
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 2rem 1rem;
            }

            .container {
                width: 100%;
                max-width: 30rem;
            }

            .logo {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.625rem;
                margin-bottom: 1.75rem;
            }

            .logo svg { height: 1.75rem; width: auto; }

            .logo span {
                font-size: 17px;
                font-weight: 600;
                color: var(--gray-900);
                letter-spacing: -0.01em;
            }

            .card {
                background: #FFFFFF;
                border: 1px solid var(--gray-200);
                border-radius: 0.75rem;
                padding: 2.25rem 2rem;
                text-align: center;
                box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 8px 24px -8px rgba(17, 24, 39, 0.08);
            }

            .alert-icon {
                width: 3rem;
                height: 3rem;
                margin: 0 auto 1.25rem;
                border-radius: 9999px;
                background: var(--accent-50);
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .alert-icon svg { width: 1.5rem; height: 1.5rem; }

            h1 {
                font-size: 18px;
                font-weight: 600;
                color: var(--gray-900);
                margin: 0 0 0.5rem;
                letter-spacing: -0.01em;
            }

            p.message {
                font-size: 14px;
                color: var(--gray-500);
                line-height: 1.6;
                margin: 0 0 1.75rem;
            }

            .actions {
                display: flex;
                flex-direction: column;
                gap: 0.625rem;
            }

            .btn {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.4rem;
                width: 100%;
                padding: 0.625rem 1rem;
                border-radius: 0.5rem;
                font-size: 14px;
                font-weight: 500;
                text-decoration: none;
                border: 1px solid transparent;
                transition: background-color 0.15s ease, border-color 0.15s ease;
                cursor: pointer;
            }

            .btn-primary {
                background: var(--accent-600);
                color: #FFFFFF;
            }
            .btn-primary:hover { background: var(--accent-700); }

            .btn-secondary {
                background: #FFFFFF;
                color: var(--gray-700);
                border-color: var(--gray-200);
            }
            .btn-secondary:hover { background: var(--gray-50); }

            .btn svg { width: 1rem; height: 1rem; flex-shrink: 0; }

            .details {
                margin-top: 1.5rem;
                text-align: left;
            }

            .details summary {
                cursor: pointer;
                font-size: 12.5px;
                font-weight: 500;
                color: var(--gray-500);
                list-style: none;
                display: flex;
                align-items: center;
                gap: 0.3rem;
                user-select: none;
            }
            .details summary::-webkit-details-marker { display: none; }
            .details summary .chevron {
                width: 0.75rem;
                height: 0.75rem;
                transition: transform 0.15s ease;
            }
            .details[open] summary .chevron { transform: rotate(90deg); }
            .details summary:hover { color: var(--gray-700); }

            .details-body {
                margin-top: 0.75rem;
                background: var(--gray-50);
                border: 1px solid var(--gray-200);
                border-radius: 0.5rem;
                padding: 0.75rem 0.875rem;
                font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
                font-size: 12px;
                color: var(--gray-600);
            }

            .detail-row {
                display: flex;
                justify-content: space-between;
                gap: 1rem;
                padding: 0.25rem 0;
            }
            .detail-row + .detail-row { border-top: 1px dashed var(--gray-200); }
            .detail-row dt { color: var(--gray-400); }
            .detail-row dd { margin: 0; color: var(--gray-700); word-break: break-all; text-align: right; }

            .footer-link {
                margin-top: 1.5rem;
                text-align: center;
                font-size: 12.5px;
                color: var(--gray-400);
            }
            .footer-link a {
                color: var(--gray-500);
                text-decoration: none;
                border-bottom: 1px solid var(--gray-200);
            }
            .footer-link a:hover { color: var(--accent-600); border-color: var(--accent-600); }
        </style>
    </head>

    <body>
        <div class="container">
            <div class="logo">
                <svg width="28" height="28" viewBox="0 0 160 120" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M93.4626 0H23.5665C10.5511 0 0 10.5511 0 23.5665V93.4626C0 106.478 10.5511 117.029 23.5665 117.029H93.4626C106.478 117.029 117.029 106.478 117.029 93.4626V23.5665C117.029 10.5511 106.478 0 93.4626 0Z"
                        fill="url(#paint0_radial_0_9)" />
                    <path
                        d="M94.4529 48.9854C89.7801 42.265 81.9046 38.3798 73.7142 38.9048C70.1965 32.552 63.6861 28.3517 56.0732 27.8792C50.7704 27.5642 45.4151 29.4018 41.2674 32.972C38.4322 35.4396 36.3846 38.2748 35.1245 41.4775C34.3895 43.3676 32.7094 44.5751 30.9243 44.5751H18.3761V55.0757H30.9243C37.0671 55.0757 42.5799 51.243 44.8901 45.3102C45.5201 43.6826 46.5702 42.265 48.1453 40.8999C50.1929 39.1148 52.8705 38.1698 55.3907 38.3273C59.1709 38.5898 61.8485 40.3224 63.5286 42.475C65.3137 44.4701 66.3113 47.5678 66.8888 50.6655C70.249 49.7204 73.9242 48.9329 77.4419 49.5104C80.3296 49.9829 83.0072 51.5055 84.9498 53.7631C85.2648 54.1307 85.5798 54.4982 85.8424 54.9182C88.3625 58.5409 88.835 63.0037 87.1549 67.4139C85.6324 71.5091 80.0145 75.2369 75.3418 75.2369H38.7997C33.8119 75.2369 29.7167 71.5091 29.0867 66.7314H18.5861C19.2686 77.337 28.0366 85.7374 38.7997 85.7374H75.3943C84.4248 85.7374 93.9278 79.3321 97.0255 71.1416C99.9132 63.4762 98.9681 55.3907 94.5054 48.9329L94.4529 48.9854Z"
                        fill="#FFFAE9" />
                    <defs>
                        <radialGradient id="paint0_radial_0_9" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                            gradientTransform="translate(-28.5 -58) rotate(54.335) scale(209.246)">
                            <stop stop-color="#40D1FF" />
                            <stop offset="1" stop-color="#0097FF" />
                        </radialGradient>
                    </defs>
                </svg>
                <span>Worf Cloud</span>
            </div>

            <div class="card">
                <div class="alert-icon">
                    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd"
                            d="M4.00288 21.3966C2.47791 21.3966 1.51397 19.7584 2.25456 18.4253L10.2527 4.02871C11.0147 2.65709 12.9873 2.6571 13.7493 4.02872L21.7474 18.4253C22.488 19.7584 21.524 21.3966 19.9991 21.3966H4.00288ZM11.9991 18.4126C12.5688 18.4126 13.0307 17.9507 13.0307 17.381C13.0307 16.8113 12.5688 16.3495 11.9991 16.3495C11.4294 16.3495 10.9675 16.8113 10.9675 17.381C10.9675 17.9507 11.4294 18.4126 11.9991 18.4126ZM13 8.8601C13 8.30782 12.5523 7.8601 12 7.8601C11.4477 7.8601 11 8.30782 11 8.8601V13.9074C11 14.4597 11.4477 14.9074 12 14.9074C12.5523 14.9074 13 14.4597 13 13.9074V8.8601Z"
                            fill="#D6932E" />
                    </svg>
                </div>

                <h1>This site isn't ready yet</h1>
                <p class="message" id="lead-message">
                    Either this address doesn't point at a site here, or it was created
                    moments ago and is still finishing setup - that usually clears up
                    within a minute or two.
                </p>

                <div class="actions">
                    <a class="btn btn-primary" href="https://worf.cloud/dashboard">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
                        Go to Dashboard
                    </a>
                    <a class="btn btn-secondary" id="retry-btn" href="#">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
                        Retry This Page
                    </a>
                </div>

                <details class="details">
                    <summary>
                        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
                        Technical details
                    </summary>
                    <div class="details-body">
                        <dl id="detail-list"></dl>
                    </div>
                </details>
            </div>

            <p class="footer-link">
                Need help? <a href="https://worf.cloud/dashboard">Contact support from your dashboard</a>.
            </p>
        </div>

        <script>
            (function () {
                var host = window.location.hostname;
                var now = new Date();
                var pad = function (n) { return String(n).padStart(2, "0"); };
                var timestamp = now.getUTCFullYear() + "-" + pad(now.getUTCMonth() + 1) + "-" + pad(now.getUTCDate())
                    + " " + pad(now.getUTCHours()) + ":" + pad(now.getUTCMinutes()) + ":" + pad(now.getUTCSeconds()) + " UTC";

                document.getElementById("lead-message").innerHTML =
                    "<strong style=\"color:#374151\">" + host + "</strong> either doesn't point at a site "
                    + "here, or it was created moments ago and is still finishing setup - that usually "
                    + "clears up within a minute or two.";

                var rows = [
                    ["Requested host", host],
                    ["Path", window.location.pathname || "/"],
                    ["Time", timestamp],
                ];
                var list = document.getElementById("detail-list");
                rows.forEach(function (row) {
                    var div = document.createElement("div");
                    div.className = "detail-row";
                    var dt = document.createElement("dt");
                    dt.textContent = row[0];
                    var dd = document.createElement("dd");
                    dd.textContent = row[1];
                    div.appendChild(dt);
                    div.appendChild(dd);
                    list.appendChild(div);
                });

                document.getElementById("retry-btn").addEventListener("click", function (e) {
                    e.preventDefault();
                    window.location.reload();
                });
            })();
        </script>
    </body>
</html>
